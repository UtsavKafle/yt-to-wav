<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube → WAV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0a09;
    --surface: #1c1917;
    --border: rgba(250, 250, 249, 0.08);
    --border-strong: rgba(250, 250, 249, 0.16);
    --text: #fafaf9;
    --muted: #a8a29e;
    --accent: #f59e0b;
    --accent-dim: rgba(245, 158, 11, 0.12);
    --error: #f87171;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    -webkit-font-smoothing: antialiased;
  }

  body {
    background-image:
      radial-gradient(ellipse at top, rgba(245, 158, 11, 0.06), transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(245, 158, 11, 0.03), transparent 40%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  main {
    width: 100%;
    max-width: 520px;
    animation: fadeUp 0.7s ease-out;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .eyebrow::before { content: '[ '; color: var(--accent); }
  .eyebrow::after  { content: ' ]'; color: var(--accent); }

  h1 {
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    font-size: clamp(48px, 8vw, 72px);
    line-height: 1;
    letter-spacing: -0.02em;
    margin-bottom: 16px;
  }
  h1 .arrow {
    font-style: italic;
    color: var(--accent);
    margin: 0 0.15em;
  }
  h1 .wav {
    font-style: italic;
  }

  .subtitle {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.05em;
    margin-bottom: 40px;
  }
  .subtitle .sep { color: var(--accent); margin: 0 8px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 24px;
  }

  .field-label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  input[type="text"] {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border-strong);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    padding: 8px 0 12px;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="text"]::placeholder { color: var(--muted); opacity: 0.5; }
  input[type="text"]:focus { border-bottom-color: var(--accent); }

  button.convert {
    width: 100%;
    margin-top: 24px;
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 2px;
    padding: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
  }
  button.convert:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 8px 24px -8px var(--accent);
  }
  button.convert:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Status / result area */
  #status {
    margin-top: 20px;
    min-height: 56px;
  }

  .status-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px;
    background: var(--accent-dim);
    border: 1px solid rgba(245, 158, 11, 0.25);
    border-radius: 2px;
  }

  .bars {
    display: flex;
    gap: 3px;
    height: 20px;
    align-items: center;
  }
  .bars span {
    display: block;
    width: 3px;
    background: var(--accent);
    border-radius: 1px;
    animation: pulse 1s ease-in-out infinite;
  }
  .bars span:nth-child(1) { animation-delay: 0.0s; }
  .bars span:nth-child(2) { animation-delay: 0.15s; }
  .bars span:nth-child(3) { animation-delay: 0.3s; }
  .bars span:nth-child(4) { animation-delay: 0.45s; }
  .bars span:nth-child(5) { animation-delay: 0.6s; }
  @keyframes pulse {
    0%, 100% { height: 4px; }
    50%      { height: 20px; }
  }

  .status-text {
    font-size: 12px;
    letter-spacing: 0.05em;
    color: var(--text);
  }
  .status-text .muted { color: var(--muted); }

  a.download {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px;
    background: var(--accent);
    color: var(--bg);
    text-decoration: none;
    border-radius: 2px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    transition: transform 0.15s, box-shadow 0.2s;
  }
  a.download:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 24px -8px var(--accent);
  }
  a.download .arrow { font-size: 18px; }

  .error {
    padding: 14px 16px;
    border: 1px solid rgba(248, 113, 113, 0.3);
    background: rgba(248, 113, 113, 0.06);
    color: var(--error);
    font-size: 12px;
    border-radius: 2px;
    word-break: break-word;
  }

  footer {
    margin-top: 32px;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
    text-align: center;
    opacity: 0.6;
  }
</style>
</head>
<body>
  <main>
    <div class="eyebrow">audio extractor</div>
    <h1>YouTube <span class="arrow">→</span> <span class="wav">wav</span></h1>
    <div class="subtitle">
      lossless from source
      <span class="sep">·</span> 48 khz
      <span class="sep">·</span> 16-bit
      <span class="sep">·</span> stereo
    </div>

    <div class="card">
      <label class="field-label" for="url">source url</label>
      <input
        id="url"
        type="text"
        placeholder="https://www.youtube.com/watch?v=..."
        autocomplete="off"
        spellcheck="false">

      <button class="convert" id="convertBtn">Convert</button>

      <div id="status"></div>
    </div>

    <footer>built with yt-dlp + ffmpeg</footer>
  </main>

<script>
  const urlInput  = document.getElementById('url');
  const button    = document.getElementById('convertBtn');
  const statusEl  = document.getElementById('status');

  function setConverting() {
    statusEl.innerHTML = `
      <div class="status-row">
        <div class="bars">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="status-text">
          extracting audio<span class="muted"> · this can take 20–60 seconds</span>
        </div>
      </div>
    `;
  }

  function setError(msg) {
    statusEl.innerHTML = `<div class="error">${msg}</div>`;
  }

  function setReady(blobUrl, filename) {
    statusEl.innerHTML = '';
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = filename;
    a.className = 'download';
    a.innerHTML = `<span>Download · ${filename}</span><span class="arrow">↓</span>`;
    statusEl.appendChild(a);
  }

  async function convert() {
    const url = urlInput.value.trim();
    if (!url) {
      setError('Paste a YouTube URL first.');
      return;
    }

    button.disabled = true;
    setConverting();

    try {
      const res = await fetch('/convert', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });

      if (!res.ok) {
        let detail = 'Conversion failed.';
        try { detail = (await res.json()).detail || detail; } catch {}
        throw new Error(detail);
      }

      // Pull filename from Content-Disposition; fall back to "audio.wav"
      const cd = res.headers.get('content-disposition') || '';
      const m = cd.match(/filename\*?=(?:UTF-8'')?["']?([^"';]+)/i);
      const filename = m ? decodeURIComponent(m[1]) : 'audio.wav';

      const blob = await res.blob();
      const blobUrl = URL.createObjectURL(blob);
      setReady(blobUrl, filename);
    } catch (e) {
      setError(e.message || String(e));
    } finally {
      button.disabled = false;
    }
  }

  button.addEventListener('click', convert);
  urlInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') convert();
  });
</script>
</body>
</html>
